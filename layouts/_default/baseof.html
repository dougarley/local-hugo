<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  {{ $css := resources.Get "css/output.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body class="h-full bg-surface-base text-text-primary antialiased">
<div class="flex h-full overflow-hidden">

  <!-- Left sidebar -->
  <aside class="w-56 shrink-0 flex flex-col bg-surface-raised border-r border-border-default overflow-y-auto">

    <!-- Site title -->
    <div class="px-5 py-4 border-b border-border-default">
      <a href="/" class="text-base font-bold tracking-tight text-accent hover:text-accent-hover transition-colors">
        {{ .Site.Title }}
      </a>
    </div>

    <!-- Nav groups -->
    <nav class="flex-1 px-2 py-4 space-y-5">

      <div>
        <p class="px-3 mb-1.5 text-[10px] font-semibold uppercase tracking-widest text-text-faint">LAN</p>
        <ul>
          <li><a href="/"              class="nav-item {{ if .IsHome }}nav-item-active{{ end }}">Home</a></li>
          <li><a href="/games/"        class="nav-item {{ if eq .Section "games"         }}nav-item-active{{ end }}">Games List</a></li>
          <li><a href="/classic-games/" class="nav-item {{ if eq .Section "classic-games" }}nav-item-active{{ end }}">Classic Games</a></li>
        </ul>
      </div>

      <div>
        <p class="px-3 mb-1.5 text-[10px] font-semibold uppercase tracking-widest text-text-faint">NASty</p>
        <ul>
          <li><a href="/shared-files/" class="nav-item {{ if eq .Section "shared-files" }}nav-item-active{{ end }}">Shared Files</a></li>
          <li><a href="/local-tv/"     class="nav-item {{ if eq .Section "local-tv"     }}nav-item-active{{ end }}">Local TV</a></li>
          <li><a href="/photos/"       class="nav-item {{ if eq .Section "photos"        }}nav-item-active{{ end }}">Photos</a></li>
        </ul>
      </div>

    </nav>
  </aside>

  <!-- Right detail panel -->
  <main class="flex-1 overflow-y-auto bg-surface-base">
    {{ block "main" . }}{{ end }}
  </main>

</div>
</body>
</html>
