{{ define "main" }}
<article class="px-12 py-12 max-w-2xl">

  <header class="mb-8 pb-6 border-b border-border-default">
    <h1 class="text-3xl font-bold text-text-primary mb-2">{{ .Title }}</h1>
    {{ with .Date }}
    <p class="text-text-faint text-sm">{{ .Format "January 2, 2006" }}</p>
    {{ end }}
  </header>

  <div class="content-body">
    {{ .Content }}
  </div>

</article>
{{ end }}
