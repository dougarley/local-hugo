<script>
  (function () {
    // navigator.clipboard only exists in secure contexts (HTTPS/localhost), so
    // guests on plain-HTTP LAN addresses fall back to execCommand('copy').
    window.copyText = function (text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('copy failed'));
      });
    };

    document.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var value = btn.dataset.copy;
        window.copyText(value).then(function () {
          var copyIcon = btn.querySelector('.copy-icon');
          var checkIcon = btn.querySelector('.check-icon');
          copyIcon.classList.add('hidden');
          checkIcon.classList.remove('hidden');
          btn.classList.add('btn-success');
          btn.classList.remove('btn-accent');
          btn.setAttribute('aria-label', 'Copied');
          clearTimeout(btn._copyResetTimer);
          btn._copyResetTimer = setTimeout(function () {
            copyIcon.classList.remove('hidden');
            checkIcon.classList.add('hidden');
            btn.classList.remove('btn-success');
            btn.classList.add('btn-accent');
            btn.setAttribute('aria-label', btn.dataset.label);
          }, 1500);
        });
      });
    });
  })();
</script>
