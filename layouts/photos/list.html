{{ define "main" }}
{{ $immich := .Site.Params.immichURL }}
{{ $album  := .Site.Params.immichAlbum }}
{{ $key    := .Site.Params.immichKey }}
<div class="px-4 sm:px-8 lg:px-12 py-8 lg:py-12">

  <div class="mb-6 pb-6 border-b border-border-default">
    <h1 id="album-name" class="text-3xl font-bold text-text-primary">Photos</h1>
    <p id="album-meta" class="mt-2 text-text-muted text-sm"></p>
  </div>

  <!-- Justified rows grouped by day, laid out by JS -->
  <div id="photo-groups"></div>

</div>

<!-- Lightbox -->
<div id="lightbox"
     class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center"
     role="dialog" aria-modal="true">
  <button id="lb-close"
          class="absolute top-4 right-5 text-white/60 hover:text-white text-3xl leading-none"
          aria-label="Close">&#x2715;</button>
  <button id="lb-prev"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white text-4xl leading-none px-2"
          aria-label="Previous">&#x2039;</button>
  <button id="lb-next"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-white/60 hover:text-white text-4xl leading-none px-2"
          aria-label="Next">&#x203a;</button>
  <img id="lb-img" src="" alt=""
       class="max-h-[90vh] max-w-[90vw] object-contain rounded shadow-2xl">
  <p id="lb-caption" class="absolute bottom-4 left-1/2 -translate-x-1/2 max-w-[90vw] truncate text-white/50 text-xs"></p>
</div>

<style>
  .photo-row {
    display: flex;
    gap: var(--photo-gap);
    margin-bottom: var(--photo-gap);
  }
  .photo-cell {
    flex: none;
    padding: 0;
    border: 0;
    background-color: var(--color-surface-raised);
    border-radius: 0.375rem;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .photo-cell:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .photo-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.2s;
  }
  .photo-cell:hover img { opacity: 0.85; }
  .photo-cell.is-loading {
    background: var(--color-surface-overlay);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .photo-cell .video-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 3px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }
</style>

<script>
(function () {
  const IMMICH = "{{ $immich }}";
  const ALBUM  = "{{ $album }}";
  const KEY    = "{{ $key }}";

  const groupsEl  = document.getElementById('photo-groups');
  const metaEl    = document.getElementById('album-meta');
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lb-img');
  const lbCaption = document.getElementById('lb-caption');

  let assets  = [];   // in display order, so the lightbox arrows follow the page
  let groups  = [];   // [{ label, items: [{ asset, ratio, cell }] }]
  let current = 0;
  const blobCache = {};

  // ── Fetch helpers ──────────────────────────────────────────────
  function apiFetch(path) {
    return fetch(`${IMMICH}${path}`, { headers: { 'x-api-key': KEY } });
  }

  async function blobURL(assetId, size) {
    const cacheKey = `${assetId}:${size}`;
    if (blobCache[cacheKey]) return blobCache[cacheKey];
    const res = await apiFetch(`/api/assets/${assetId}/thumbnail?size=${size}`);
    if (!res.ok) throw new Error(`thumbnail ${res.status}`);
    const url = URL.createObjectURL(await res.blob());
    blobCache[cacheKey] = url;
    return url;
  }

  // ── Dates ──────────────────────────────────────────────────────
  // Immich's localDateTime is the wall-clock time labelled as UTC, so read it back in UTC.
  const dayFmt   = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const rangeFmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const takenAt  = a => a.localDateTime || a.fileCreatedAt;

  // Width / height, preferring Immich's orientation-corrected size
  function aspectRatio(a) {
    if (a.width && a.height) return a.width / a.height;
    const ex = a.exifInfo || {};
    if (ex.exifImageWidth && ex.exifImageHeight) {
      const rotated = ['5', '6', '7', '8'].includes(String(ex.orientation));
      return rotated ? ex.exifImageHeight / ex.exifImageWidth : ex.exifImageWidth / ex.exifImageHeight;
    }
    return 1;
  }

  // ── Lazy thumbnails ────────────────────────────────────────────
  const thumbObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      thumbObserver.unobserve(entry.target);
      const cell  = entry.target;
      const asset = assets[cell.dataset.index];
      blobURL(asset.id, 'thumbnail').then(url => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        cell.prepend(img);
      }).catch(() => {}).finally(() => cell.classList.remove('is-loading'));
    });
  }, { rootMargin: '400px' });

  function buildGroups(items, newestFirst) {
    const sorted = items.slice().sort((a, b) =>
      newestFirst ? takenAt(b).localeCompare(takenAt(a)) : takenAt(a).localeCompare(takenAt(b)));
    const byDay = new Map();
    sorted.forEach(a => {
      const day = takenAt(a).slice(0, 10);
      if (!byDay.has(day)) byDay.set(day, []);
      byDay.get(day).push(a);
    });

    assets = [];
    groups = [...byDay.entries()].map(([day, list]) => ({
      label: dayFmt.format(new Date(`${day}T00:00:00Z`)),
      items: list.map(asset => {
        const index = assets.push(asset) - 1;
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'photo-cell is-loading';
        cell.dataset.index = index;
        cell.setAttribute('aria-label', asset.originalFileName || 'Open photo');
        if (asset.type === 'VIDEO') cell.insertAdjacentHTML('beforeend', '<span class="video-badge">▶ video</span>');
        cell.addEventListener('click', () => openLightbox(index));
        thumbObserver.observe(cell);
        return { asset, ratio: aspectRatio(asset), cell };
      }),
    }));
  }

  // ── Justified layout ───────────────────────────────────────────
  // Fill each row at the target height, then scale it to span the width exactly.
  // The last row of a day keeps the target height rather than stretching.
  function layout() {
    const width = groupsEl.clientWidth;
    if (!width || !groups.length) return;
    const targetH = width < 640 ? 130 : width < 1024 ? 180 : 235;
    const gap     = width < 640 ? 3 : 4;
    groupsEl.style.setProperty('--photo-gap', `${gap}px`);

    const frag = document.createDocumentFragment();
    groups.forEach(group => {
      const section = document.createElement('section');
      section.className = 'mb-6';
      section.innerHTML = `<h2 class="text-sm font-semibold text-text-primary mb-2"></h2>`;
      section.firstChild.textContent = group.label;

      let row = [];
      let ratioSum = 0;
      const flush = (fill) => {
        if (!row.length) return;
        const h = fill ? (width - gap * (row.length - 1)) / ratioSum : targetH;
        const rowEl = document.createElement('div');
        rowEl.className = 'photo-row';
        row.forEach(item => {
          item.cell.style.width  = `${item.ratio * h}px`;
          item.cell.style.height = `${h}px`;
          rowEl.appendChild(item.cell);
        });
        section.appendChild(rowEl);
        row = []; ratioSum = 0;
      };

      group.items.forEach(item => {
        row.push(item);
        ratioSum += item.ratio;
        if (ratioSum * targetH + gap * (row.length - 1) >= width) flush(true);
      });
      flush(false);
      frag.appendChild(section);
    });
    groupsEl.replaceChildren(frag);
  }

  let lastWidth = 0;
  new ResizeObserver(() => {
    if (groupsEl.clientWidth === lastWidth) return;
    lastWidth = groupsEl.clientWidth;
    layout();
  }).observe(groupsEl);

  // ── Lightbox ───────────────────────────────────────────────────
  function openLightbox(index) {
    current = index;
    lightbox.classList.replace('hidden', 'flex');
    loadLightboxImage(current);
  }

  function closeLightbox() {
    lightbox.classList.replace('flex', 'hidden');
    lbImg.src = '';
  }

  async function loadLightboxImage(index) {
    const asset = assets[index];
    lbImg.style.opacity = '0.4';
    lbCaption.textContent = asset.originalFileName || '';
    try {
      lbImg.src = await blobURL(asset.id, 'preview');
    } catch {
      lbImg.src = '';
    }
    lbImg.style.opacity = '1';
  }

  function navigate(dir) {
    current = (current + dir + assets.length) % assets.length;
    loadLightboxImage(current);
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => navigate(-1));
  document.getElementById('lb-next').addEventListener('click', () => navigate(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (lightbox.classList.contains('hidden')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')   navigate(-1);
    if (e.key === 'ArrowRight')  navigate(1);
  });

  // ── Load album ─────────────────────────────────────────────────
  async function init() {
    metaEl.textContent = 'Loading…';
    try {
      const res = await apiFetch(`/api/albums/${ALBUM}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const album = await res.json();

      document.getElementById('album-name').textContent = album.albumName || 'Photos';
      const items = (album.assets || []).filter(a => a.type === 'IMAGE' || a.type === 'VIDEO');
      const count = `${items.length} item${items.length !== 1 ? 's' : ''}`;
      const start = album.startDate && rangeFmt.format(new Date(album.startDate));
      const end   = album.endDate && rangeFmt.format(new Date(album.endDate));
      metaEl.textContent = [start && (start === end ? start : `${start} – ${end}`), count].filter(Boolean).join(' · ');

      buildGroups(items, album.order !== 'asc');
      layout();
    } catch (err) {
      metaEl.textContent = '';
      groupsEl.innerHTML = `
        <div class="text-xs space-y-1">
          <p class="text-accent font-medium">Could not load album</p>
          <p class="text-text-faint"></p>
          <p class="text-text-faint">Check the IP, album ID, and API key in hugo.toml. Immich must also allow CORS from this site's origin.</p>
        </div>`;
      groupsEl.querySelector('p + p').textContent = err.message;
    }
  }

  init();
})();
</script>
{{ end }}
