baseURL = 'https://example.org/'
locale = 'en-us'
title = "LAN Hub"

# Sensitive values should be set via environment variables in your
# HugoMods docker config on Unraid — Hugo reads HUGO_PARAMS_* automatically:
#
#   HUGO_PARAMS_TUNARRURL   = http://your-nas-ip:8000
#   HUGO_PARAMS_IMMICHURL   = http://your-immich-url
#   HUGO_PARAMS_IMMICHALBUM = your-album-id
#   HUGO_PARAMS_IMMICHKEY   = your-api-key
#   HUGO_PARAMS_WEATHERLAT  = 40.7128
#   HUGO_PARAMS_WEATHERLON  = -74.0060
#   HUGO_PARAMS_WEATHERLABEL = Your Town, ST

[params]
  tunarrURL    = ""
  immichURL    = ""
  immichAlbum  = ""
  immichKey    = ""
  weatherLat   = ""
  weatherLon   = ""
  weatherLabel = ""
